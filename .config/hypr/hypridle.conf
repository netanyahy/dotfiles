# Конфигурация hypridle — Полностью отключен спящий режим и блокировка

general {
    # Позволяет сторонним приложениям (плееры, браузеры) блокировать засыпание
    lock_cmd = true                 
    unlock_cmd = true               
    ignore_dbus_inhibit = false     
}

# Все блоки "listener" удалены или закомментированы.
# Экран больше не будет гаснуть, блокироваться или уходить в сон.

# Theme: ❄️ White Frost (white)
# Generated for Starship Prompt
add_newline = false
palette = "white"

format = """
[](fg:accent)\
$os\
[](fg:accent bg:dir_bg)\
$directory\
[](fg:dir_bg)\
$git_branch\
$cmd_duration\
\n$character"""

[palettes.white]
accent = "#0066cc"
accent_fg = "#ffffff"
secondary = "#0055bb"
secondary_fg = "#ffffff"
dir_bg = "#cdced2"
dir_fg = "#1c1d21"
dur_bg = "#dadbdf"
dur_fg = "#1c1d21"
error = "#d20f39"

[os]
disabled = false
style = "bg:accent fg:accent_fg"
format = "[ $symbol ]($style)"

[os.symbols]
Arch = "󰣇"
Gentoo = ""
Ubuntu = "󰕈"
Debian = "󰣚"
Fedora = "󰣛"
Manjaro = ""
Linux = "󰌽"

[directory]
style = "fg:dir_fg bg:dir_bg"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"

[git_branch]
style = "fg:secondary_fg bg:secondary"
symbol = "󰘬 "
format = " [](fg:secondary)[ $symbol$branch ]($style)[](fg:secondary)"

[cmd_duration]
min_time = 500
style = "fg:dur_fg bg:dur_bg"
format = " [](fg:dur_bg)[ 󰔛 $duration ]($style)[](fg:dur_bg)"

[character]
success_symbol = "[➜](bold fg:accent) "
error_symbol = "[➜](bold fg:error) "

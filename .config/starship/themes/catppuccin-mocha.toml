# Theme: ☕ Catppuccin Mocha (catppuccin-mocha)
# Generated for Starship Prompt
add_newline = false
palette = "catppuccin-mocha"

format = """
[](fg:accent)\
$os\
[](fg:accent bg:dir_bg)\
$directory\
[](fg:dir_bg)\
$git_branch\
$cmd_duration\
\n$character"""

[palettes.catppuccin-mocha]
accent = "#cba6f7"
accent_fg = "#11111b"
secondary = "#f5c2e7"
secondary_fg = "#11111b"
dir_bg = "#3d3f51"
dir_fg = "#cdd6f4"
dur_bg = "#333445"
dur_fg = "#cdd6f4"
error = "#ff5555"

[os]
disabled = false
style = "bg:accent fg:accent_fg"
format = "[ $symbol ]($style)"

[os.symbols]
Arch = "󰣇"
Gentoo = ""
Ubuntu = "󰕈"
Debian = "󰣚"
Fedora = "󰣛"
Manjaro = ""
Linux = "󰌽"

[directory]
style = "fg:dir_fg bg:dir_bg"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"

[git_branch]
style = "fg:secondary_fg bg:secondary"
symbol = "󰘬 "
format = " [](fg:secondary)[ $symbol$branch ]($style)[](fg:secondary)"

[cmd_duration]
min_time = 500
style = "fg:dur_fg bg:dur_bg"
format = " [](fg:dur_bg)[ 󰔛 $duration ]($style)[](fg:dur_bg)"

[character]
success_symbol = "[➜](bold fg:accent) "
error_symbol = "[➜](bold fg:error) "

# Tokyo Night Powerline Preset
add_newline = false

format = """[](fg:#7aa2f7)$os[](fg:#7aa2f7 bg:#3b4261)[ $directory ](bg:#3b4261 fg:#c0caf5)[](fg:#3b4261 bg:#bb9af7)$git_branch[](fg:#bb9af7 bg:#24283b)[ $cmd_duration ](bg:#24283b fg:#e0af68)[](fg:#24283b)
$character"""

[os]
disabled = false
style = "bg:#7aa2f7 fg:#1a1b26"
format = "[ $symbol ]($style)"

[os.symbols]
Arch = "󰣇"
Gentoo = ""
Ubuntu = "󰕈"
Debian = "󰣚"
Fedora = "󰣛"
Manjaro = ""
Linux = "󰌽"

[directory]
style = "bg:#3b4261 fg:#c0caf5"
format = "[$path]($style)"
truncation_length = 3

[git_branch]
style = "bg:#bb9af7 fg:#1a1b26"
symbol = " "
format = "[$symbol$branch ]($style)"

[cmd_duration]
min_time = 500
style = "bg:#24283b fg:#e0af68"
format = "[󰔛 $duration]($style)"

[character]
success_symbol = "[➜](bold #9ece6a)"
error_symbol = "[➜](bold #f7768e)"

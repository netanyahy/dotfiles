# Gruvbox Retro Preset
add_newline = false

format = """[](fg:#fabd2f)$os[](fg:#fabd2f bg:#504945)[ $directory ](bg:#504945 fg:#ebdbb2)[](fg:#504945 bg:#b8bb26)$git_branch[](fg:#b8bb26 bg:#3c3836)[ $cmd_duration ](bg:#3c3836 fg:#fe8019)[](fg:#3c3836)
$character"""

[os]
disabled = false
style = "bg:#fabd2f fg:#282828"
format = "[ $symbol ]($style)"

[os.symbols]
Arch = "󰣇"
Gentoo = ""
Ubuntu = "󰕈"
Debian = "󰣚"
Fedora = "󰣛"
Manjaro = ""
Linux = "󰌽"

[directory]
style = "bg:#504945 fg:#ebdbb2"
format = "[$path]($style)"

[git_branch]
style = "bg:#b8bb26 fg:#282828"
symbol = " 󰘬 "
format = "[$symbol$branch ]($style)"

[cmd_duration]
min_time = 500
style = "bg:#3c3836 fg:#fe8019"
format = "[󰔛 $duration]($style)"

[character]
success_symbol = "[❯](bold #b8bb26)"
error_symbol = "[❯](bold #fb4934)"
